<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meet Notes helper</title>
<style>
body{margin:0;background:#f6f7fb;font:15px/1.5 system-ui,sans-serif;color:#111827}
header{background:linear-gradient(135deg,#4f46e5,#9333ea);color:#fff;padding:20px 24px}
h1{margin:0;font-size:20px}
main{max-width:560px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(30,30,60,.08);padding:20px}
.row{display:flex;gap:8px;margin:12px 0}
input{flex:1;font:13px ui-monospace,Consolas,monospace;padding:9px 10px;border:1px solid #d1d5db;border-radius:8px;min-width:0}
button{background:#111827;color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
p{margin:8px 0}.hint{color:#4b5563}
</style></head>
<body>
<header><h1>Meet Notes helper</h1></header>
<main><div class="card">
<p><strong>Meet Notes helper is running</strong></p>
<div class="row"><input id="token" type="text" readonly value="__TOKEN__"><button id="copy" type="button">Copy</button></div>
<p class="hint">Paste it into Meet Notes → Settings → Advanced → Local helper → Token.</p>
<p id="status" class="hint" aria-live="polite"></p>
</div></main>
<script>
const input = document.getElementById("token");
const status = document.getElementById("status");
document.getElementById("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(input.value);
    status.textContent = "Copied.";
  } catch (e) {
    input.select();
    status.textContent = "Press Ctrl+C to copy the selected token.";
  }
});
</script>
</body></html>
