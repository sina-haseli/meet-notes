[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetnotes"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "httpx",
  "markdown",
  "google-api-python-client",
  "google-auth-oauthlib",
  "python-multipart",
  "tomli-w",
  "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[tool.setuptools]
packages = ["meetnotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
meetnotes = ["templates/*.md", "review/*"]
